name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build publish directory
        run: |
          rm -rf .deploy && mkdir .deploy
          cp index.html sidhpur-map.jpg _redirects .deploy/
          cp -r images .deploy/images

      - name: Check Netlify auth token
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set."
            echo "Either add the secret (see README Go live section) or link the GitHub repo in Netlify for continuous deployment."
            exit 1
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx netlify-cli deploy --prod \
            --dir=.deploy \
            --functions=netlify/functions \
            --site=ba643c7e-14a9-40af-bf6e-acc0a5a6ce0d
