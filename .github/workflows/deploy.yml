name: Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: 32.193.181.198
          EC2_USER: ubuntu
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::EC2_SSH_KEY secret is not set. Add the stealthtanks-web private key to GitHub repo secrets."
            exit 1
          fi
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          rsync -avz --delete \
            --exclude node_modules --exclude data --exclude .git \
            --exclude .deploy --exclude .netlify \
            -e "ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key" \
            ./ $EC2_USER@$EC2_HOST:/var/www/impact-festival/
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key $EC2_USER@$EC2_HOST "
            set -e
            cd /var/www/impact-festival
            mkdir -p data/registrations
            if [ -f .env ]; then set -a; . ./.env; set +a; fi
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
            echo 'Deployed at '\$(date)
          "
