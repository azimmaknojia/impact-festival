[build]
  command = "rm -rf .deploy && mkdir .deploy && cp index.html sidhpur-map.jpg _redirects .deploy/ && cp -r images .deploy/images"
  publish = ".deploy"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "http://theimpactfestival.com/*"
  to = "https://theimpactfestival.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.theimpactfestival.com/*"
  to = "https://theimpactfestival.com/:splat"
  status = 301
  force = true

